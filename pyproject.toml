[project]
name = "longevityclaw"
version = "0.3.0"
description = "AI agent for biological age prediction, interpretation, and personalized interventions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=14.3.3",
    "prompt-toolkit>=3.0.52",
    "pyarrow>=23.0.1",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "shap>=0.51.0",
    "biothings-client[caching]>=0.4",
    "gseapy>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "python-socketio>=5.16.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
longevityclaw = "longevityclaw.cli:main"
longevityclaw-web = "longevityclaw.web.server:main"
longevityclaw-score = "longevityclaw.target_scoring:main"
