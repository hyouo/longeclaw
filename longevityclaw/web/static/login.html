<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LongevityClaw</title>
<style>
  :root {
    --deep: #005461;
    --dark: #0C7779;
    --mid: #249E94;
    --bright: #3BC1A8;
    --bg: #0a1a1e;
    --bg2: #0d2228;
    --text: #c8dfe4;
    --text-dim: #6a9ba5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .login-box {
    background: var(--bg2);
    border: 1px solid var(--deep);
    border-radius: 12px;
    padding: 40px;
    width: 360px;
    text-align: center;
  }
  .logo {
    color: var(--bright);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 32px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--deep);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="password"]:focus {
    border-color: var(--bright);
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    background: var(--deep);
    border: 1px solid var(--dark);
    border-radius: 6px;
    color: var(--bright);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: var(--dark);
  }
  .error {
    color: #e55;
    font-size: 12px;
    margin-top: 12px;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">LongevityClaw</div>
  <div class="subtitle">233 clocks &middot; 6 modalities &middot; Enter password to continue</div>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button type="submit">Enter</button>
  </form>
  <div class="error" id="error"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('error');
  errEl.textContent = '';
  try {
    const resp = await fetch('/api/auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw}),
    });
    const data = await resp.json();
    if (data.ok) {
      window.location.reload();
    } else {
      errEl.textContent = data.error || 'Authentication failed';
    }
  } catch (e) {
    errEl.textContent = 'Connection error';
  }
});
</script>
</body>
</html>
